<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SYNC LAB</title>
<link rel="icon" href="/logo-sm.webp">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Cairo:wght@600;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0c;color:#fff;font-family:Cairo,sans-serif;min-height:100vh;display:grid;place-items:center;padding:40px 16px}
main{width:min(900px,100%);text-align:center}
.logo{height:70px;aspect-ratio:1.354;margin:0 auto 18px;background:url(/logo-sm.webp) center/contain no-repeat}
h1{font:800 14px Syne;letter-spacing:.5em;color:#ff2d55;margin-bottom:10px}
p{color:#8d8d94;margin-bottom:40px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}
a{display:block;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:44px 24px;background:linear-gradient(160deg,rgba(255,255,255,.04),transparent);transition:.3s}
a:hover{border-color:#ff2d55;transform:translateY(-4px)}
a b{display:block;font:800 30px Syne;margin-bottom:8px}
a span{color:#8d8d94;font-size:15px}
@media(max-width:600px){.g{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <div class="logo"></div>
  <h1>SYNC LAB</h1>
  <p>تجارب لطريقة عرض الأعمال — جربهم على الموبايل والكمبيوتر</p>
  <div class="g">
    <a href="deck.html"><b>01 · DECK</b><span>البوسترات بحجم الشاشة — كل سكرول يرمي بوستر ويظهر اللي بعده، والخلفية بتاخد لونه</span></a>
    <a href="particles.html"><b>02 · PARTICLES</b><span>البوستر بيتجمع من آلاف الذرات وينفجر ويتحول للي بعده — حرّك الماوس أو صباعك عليه</span></a>
  </div>
</main>
</body>
</html>
