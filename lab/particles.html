<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SYNC LAB — Poster Particles</title>
<link rel="icon" href="/logo-sm.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#050506}
body{color:#fff;font-family:Cairo,Syne,sans-serif;overflow-x:clip}
#track{height:calc((var(--n,8) + .6) * 100vh)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 55% at 50% 45%,rgba(var(--c,255,45,85),.22),transparent 70%);transition:background .6s}
.hud{position:fixed;left:0;right:0;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;font:700 11px Syne;letter-spacing:.3em;z-index:5;pointer-events:none}
.hud a{pointer-events:auto}
.top{top:0}.bot{bottom:0;align-items:flex-end}
.logo{height:34px;aspect-ratio:1.354;background:url(/logo-sm.webp) center/contain no-repeat}
.back{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:9px 16px;border-radius:30px;letter-spacing:.15em}
.num{font:800 clamp(40px,6vw,80px)/1 Syne;letter-spacing:-.04em}
.num small{font-size:.3em;color:rgba(255,255,255,.55);letter-spacing:0;margin-left:6px}
.ttl{font:900 clamp(22px,3vw,40px)/1.15 Cairo;max-width:60vw;text-align:right;transition:opacity .4s,filter .4s}
.ttl.hide{opacity:0;filter:blur(8px)}
.hint{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);font:700 10px Syne;letter-spacing:.35em;opacity:.7;z-index:5;transition:opacity .4s;pointer-events:none;white-space:nowrap}
.bar{position:fixed;left:24px;right:24px;bottom:12px;height:2px;background:rgba(255,255,255,.15);z-index:5}
.bar i{display:block;height:100%;width:0;background:#fff}
.load{position:fixed;inset:0;display:grid;place-items:center;font:700 12px Syne;letter-spacing:.4em;z-index:9;background:#050506;transition:opacity .6s}
.nogl{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;z-index:8}
@media(max-width:700px){.hud{padding:16px}.ttl{max-width:70vw}.hint{bottom:96px}}
</style>
</head>
<body>
<div class="load" id="load">BUILDING PARTICLES…</div>
<canvas id="cv"></canvas><div class="glow"></div>
<div class="nogl" id="nogl">This demo needs WebGL.</div>
<div class="hud top"><a href="/lab/" class="logo" aria-label="SYNC LAB"></a><a class="back" href="/">← SITE</a></div>
<div class="hint" id="hint">SCROLL ↓ · MOVE / TOUCH THE POSTER</div>
<div class="hud bot"><div class="num" id="num"></div><div class="ttl" id="ttl"></div></div>
<div class="bar"><i id="bar"></i></div>
<div id="track"></div>
<script src="lab.js"></script>
<script>
(async () => {
  const cv = document.getElementById("cv");
  const gl = cv.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" });
  if (!gl){ document.getElementById("nogl").style.display = "grid"; document.getElementById("load").remove(); return }

  const MOB = innerWidth < 700, COLS = MOB ? 90 : 150, ROWS = Math.round(COLS * 1.3), N = COLS * ROWS;
  const works = await LAB.works(12);
  const imgs = await Promise.all(works.map(w => LAB.load(w.img).catch(() => null)));
  const items = works.map((w, i) => ({ ...w, im: imgs[i] })).filter(x => x.im);
  const n = items.length; document.documentElement.style.setProperty("--n", n);

  /* ---- sample each poster into N points (positions in px, colours 0–1) ---- */
  let W = innerWidth, H = innerHeight, DPR = Math.min(2, devicePixelRatio || 1);
  function sample(it){
    const r = it.im.naturalWidth / it.im.naturalHeight;
    const h = Math.min(H * .74, W * (MOB ? .86 : .6) / r), w = h * r, x0 = (W - w) / 2, y0 = (H - h) / 2 - H * .02;
    const cols = COLS, rows = Math.max(1, Math.round(COLS / r));
    const c = document.createElement("canvas"), x = c.getContext("2d", { willReadFrequently: true }); c.width = cols; c.height = rows;
    x.drawImage(it.im, 0, 0, cols, rows); const d = x.getImageData(0, 0, cols, rows).data;
    const pos = new Float32Array(N * 2), col = new Float32Array(N * 3), total = cols * rows;
    for (let k = 0; k < N; k++){
      const s = k < total ? k : Math.floor(Math.random() * total);      // reuse points if poster has fewer
      const cx = s % cols, cy = Math.floor(s / cols);
      pos[k*2] = x0 + (cx + .5) / cols * w; pos[k*2+1] = y0 + (cy + .5) / rows * h;
      col[k*3] = d[s*4] / 255; col[k*3+1] = d[s*4+1] / 255; col[k*3+2] = d[s*4+2] / 255;
    }
    it.pos = pos; it.colr = col; it.cell = w / cols; it.col = LAB.color(it.im);
  }
  function cloud(){
    const pos = new Float32Array(N * 2), col = new Float32Array(N * 3);
    for (let k = 0; k < N; k++){ const a = Math.random() * 6.283, rr = Math.pow(Math.random(), .5) * Math.max(W, H) * .8;
      pos[k*2] = W/2 + Math.cos(a) * rr; pos[k*2+1] = H/2 + Math.sin(a) * rr; col[k*3] = col[k*3+1] = col[k*3+2] = .15 + Math.random() * .25 }
    return { pos, colr: col, cell: 2 };
  }
  items.forEach(sample);
  let CLOUD = cloud();

  /* ---- WebGL ---- */
  const VS = `
  attribute vec2 aA; attribute vec3 cA; attribute vec2 aB; attribute vec3 cB; attribute vec3 aR;
  uniform float uMix, uTime, uSize, uDpr; uniform vec2 uRes, uMouse; uniform float uRad;
  varying vec3 vC; varying float vA;
  void main(){
    float e = uMix*uMix*(3.0-2.0*uMix);
    vec2 p = mix(aA, aB, e);
    float burst = sin(uMix*3.14159);
    vec2 dir = normalize(aR.xy - 0.5 + 0.0001);
    p += dir * burst * (120.0 + aR.z*520.0);                                  // explode outward
    float ang = uTime*0.6 + aR.z*6.2831;
    p += vec2(cos(ang), sin(ang)) * burst * 60.0 * aR.x;                      // swirl
    p += vec2(sin(uTime*1.7 + aR.x*40.0), cos(uTime*1.4 + aR.y*40.0)) * 0.9;  // idle shimmer
    vec2 d = p - uMouse; float l = length(d);
    float f = smoothstep(uRad, 0.0, l);
    p += (d / (l + 0.001)) * f * uRad * 0.55;                                 // mouse / finger pushes particles
    vec2 clip = p / uRes * 2.0 - 1.0; clip.y = -clip.y;
    gl_Position = vec4(clip, 0.0, 1.0);
    gl_PointSize = uSize * uDpr * (1.0 + burst*0.8 + f*0.6);
    vC = mix(cA, cB, e) * (1.0 + f*0.5 + burst*0.25);
    vA = 1.0 - burst*0.15;
  }`;
  const FS = `precision mediump float; varying vec3 vC; varying float vA;
  void main(){ vec2 c = gl_PointCoord - 0.5; float d = dot(c,c); if (d > 0.25) discard; gl_FragColor = vec4(vC * (1.0 - d*1.2), vA); }`;
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
  const buf = (name, size, data, usage) => { const b = gl.createBuffer(), loc = gl.getAttribLocation(pr, name); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, data, usage); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0); return b };
  const rnd = new Float32Array(N * 3).map(() => Math.random());
  const bA = buf("aA", 2, CLOUD.pos, gl.DYNAMIC_DRAW), bCA = buf("cA", 3, CLOUD.colr, gl.DYNAMIC_DRAW);
  const bB = buf("aB", 2, items[0].pos, gl.DYNAMIC_DRAW), bCB = buf("cB", 3, items[0].colr, gl.DYNAMIC_DRAW);
  buf("aR", 3, rnd, gl.STATIC_DRAW);
  const U = {}; ["uMix","uTime","uSize","uDpr","uRes","uMouse","uRad"].forEach(k => U[k] = gl.getUniformLocation(pr, k));
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  const put = (b, d) => { gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferSubData(gl.ARRAY_BUFFER, 0, d) };

  function resize(){
    W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; gl.viewport(0, 0, cv.width, cv.height);
    items.forEach(sample); CLOUD = cloud(); seg = -2;
  }
  addEventListener("resize", () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 200) });

  /* ---- pointer ---- */
  let mx = -9999, my = -9999, tmx = -9999, tmy = -9999;
  const pt = e => { const p = e.touches ? e.touches[0] : e; tmx = p.clientX; tmy = p.clientY };
  addEventListener("mousemove", pt, { passive: true }); addEventListener("touchmove", pt, { passive: true }); addEventListener("touchstart", pt, { passive: true });
  addEventListener("touchend", () => { tmx = tmy = -9999 }); document.addEventListener("mouseleave", () => { tmx = tmy = -9999 });

  /* ---- frame: list = [cloud, p0, p1, …]; intro assembles p0, scroll morphs to the next ---- */
  let seg = -2, shown = -1, t0 = performance.now();
  const lists = () => [CLOUD, ...items];
  function frame(now){
    const intro = Math.min(1, Math.max(0, (now - t0) / 2400));
    const f = Math.max(0, Math.min(n, intro + scrollY / innerHeight));
    const k = Math.min(n - 1, Math.floor(f)), m = f - k;
    const L = lists();
    if (k !== seg){ seg = k; put(bA, L[k].pos); put(bCA, L[k].colr); put(bB, L[k+1].pos); put(bCB, L[k+1].colr) }
    const mix = Math.min(1, Math.max(0, (m - .12) / .76));
    mx += (tmx - mx) * .15; my += (tmy - my) * .15; if (tmx < -999){ mx = tmx; my = tmy }
    gl.clearColor(.02, .02, .025, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(U.uMix, mix); gl.uniform1f(U.uTime, now / 1000); gl.uniform1f(U.uDpr, DPR);
    gl.uniform1f(U.uSize, Math.max(L[k].cell, L[k+1].cell) * 1.05); gl.uniform2f(U.uRes, W, H);
    gl.uniform2f(U.uMouse, mx, my); gl.uniform1f(U.uRad, MOB ? 90 : 130);
    gl.drawArrays(gl.POINTS, 0, N);

    const cur = Math.max(0, Math.min(n - 1, Math.round(f) - 1)), busy = mix > .15 && mix < .85;
    const ttl = document.getElementById("ttl"); ttl.classList.toggle("hide", busy || intro < .8);
    if (cur !== shown){ shown = cur; const it = items[cur];
      ttl.textContent = it.title; ttl.dir = /[؀-ۿ]/.test(it.title) ? "rtl" : "ltr";
      document.getElementById("num").innerHTML = String(cur + 1).padStart(2, "0") + `<small>/ ${String(n).padStart(2, "0")}</small>`;
      document.documentElement.style.setProperty("--c", it.col.join(",")) }
    document.getElementById("bar").style.width = (Math.max(0, f - 1) / Math.max(1, n - 1) * 100) + "%";
    document.getElementById("hint").style.opacity = scrollY > 40 ? 0 : .7;
    requestAnimationFrame(frame);
  }
  resize(); requestAnimationFrame(frame);
  const LD = document.getElementById("load"); LD.style.opacity = 0; setTimeout(() => LD.remove(), 700);
})();
</script>
</body>
</html>
