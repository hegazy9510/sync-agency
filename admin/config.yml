# SYNC AGENCY — Control panel (Sveltia CMS, free)
backend:
  name: github
  repo: hegazy9510/sync-agency
  branch: main

# كل الصور اللي بترفعها بتتحفظ هنا، وبتتحول تلقائياً لـ WebP خفيفة
media_folder: uploads
public_folder: uploads
media_libraries:
  default:
    config:
      max_file_size: 30000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400

site_url: https://sync-agency.vercel.app/
logo_url: ../logo.webp

collections:
  - name: portfolio
    label: "🎬 الأعمال"
    description: "أضف أو احذف أو رتّب البوسترات والكليبات لكل قسم"
    editor: { preview: false }
    files:
      - name: film
        label: "أفلام"
        file: content/film.json
        fields:
          - name: items
            label: "الأعمال"
            label_singular: "عمل"
            widget: list
            add_to_top: true
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: "اسم العمل", widget: string }
              - { name: image, label: "البوستر / الصورة", widget: image, required: false, hint: "ارفع الصورة هنا — بتتضغط تلقائياً" }
              - { name: video_url, label: "لينك فيديو (YouTube أو mp4)", widget: string, required: false, hint: "للكليبات: حط لينك يوتيوب — أفضل من رفع ملف" }
              - { name: video_file, label: "أو ارفع ملف فيديو mp4 (أقل من 30MB)", widget: file, required: false }
              - { name: date, label: "سطر صغير (السنة / الموسم)", widget: string, required: false }
              - { name: featured, label: "مميز — يظهر في الأول", widget: boolean, default: false, required: false }
              - { name: hidden, label: "إخفاء من الموقع", widget: boolean, default: false, required: false }
      - name: series
        label: "مسلسلات"
        file: content/series.json
