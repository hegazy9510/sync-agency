        label: "كل إعدادات الموقع"
        file: content/settings.json
        fields:
          - { name: site_title, label: "عنوان الموقع (في تاب المتصفح وجوجل)", widget: string }
          - { name: logo, label: "اللوجو (سيبه فاضي = اللوجو الحالي)", widget: image, required: false }
          - { name: accent, label: "اللون الأساسي", widget: color, required: false }
          - { name: background, label: "لون الخلفية", widget: color, required: false }
          - { name: email, label: "الإيميل", widget: string }
          - { name: portrait, label: "صورتك الشخصية", widget: image, required: false }
          - name: text_ar
            label: "📝 كل الكلام بالعربي"
            widget: object
            collapsed: true
            hint: "تقدر تستخدم <span>كلمة</span> عشان تتلون باللون الأساسي"
            fields:
              - { name: hero, label: "وصف الصفحة الرئيسية", widget: text, required: false }
              - { name: nWork, label: "قائمة: الأعمال", widget: string, required: false }
              - { name: nAbout, label: "قائمة: عنّي", widget: string, required: false }
              - { name: nSvc, label: "قائمة: الخدمات", widget: string, required: false }
              - { name: nCl, label: "قائمة: العملاء", widget: string, required: false }
              - { name: nCt, label: "زرار التواصل اللي فوق", widget: string, required: false }
              - { name: b1, label: "زرار 1 في الرئيسية", widget: string, required: false }
              - { name: b2, label: "زرار 2 في الرئيسية", widget: string, required: false }
              - { name: drag, label: "جملة السحب تحت", widget: string, required: false }
              - { name: wEy, label: "عنوان صغير: الأعمال", widget: string, required: false }
              - { name: wH, label: "عنوان كبير: الأعمال", widget: string, required: false }
              - { name: aEy, label: "عنوان صغير: عنّي", widget: string, required: false }
              - { name: aName, label: "اسمك", widget: string, required: false }
              - { name: sEy, label: "عنوان صغير: الخدمات", widget: string, required: false }
