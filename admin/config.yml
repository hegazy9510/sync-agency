              - { name: cEy, label: "عنوان صغير: العملاء", widget: string, required: false }
              - { name: cH, label: "عنوان كبير: العملاء", widget: string, required: false }
              - { name: ctEy, label: "عنوان صغير: التواصل", widget: string, required: false }
              - { name: ctH, label: "عنوان كبير: التواصل", widget: string, required: false }
              - { name: ctP, label: "جملة التواصل", widget: text, required: false }
              - { name: ctB, label: "زرار الإيميل", widget: string, required: false }
              - { name: foot, label: "الفوتر", widget: string, required: false }
              - { name: all, label: "فلتر: الكل", widget: string, required: false }
              - { name: hook, label: "الجملة الكبيرة في (عنّي)", widget: text, required: false }
              - { name: about, label: "التعريف (افصل الفقرات بسطر فاضي)", widget: text, required: false }
          - name: text_en
            label: "📝 All English text"
            widget: object
            collapsed: true
            fields:
              - { name: hero, label: "hero", widget: text, required: false }
              - { name: nWork, label: "nWork", widget: string, required: false }
              - { name: nAbout, label: "nAbout", widget: string, required: false }
              - { name: nSvc, label: "nSvc", widget: string, required: false }
