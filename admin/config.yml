              - { name: wEy, label: "wEy", widget: string, required: false }
              - { name: wH, label: "wH", widget: string, required: false }
              - { name: aEy, label: "aEy", widget: string, required: false }
              - { name: aName, label: "aName", widget: string, required: false }
              - { name: sEy, label: "sEy", widget: string, required: false }
              - { name: sH, label: "sH", widget: string, required: false }
              - { name: cEy, label: "cEy", widget: string, required: false }
              - { name: cH, label: "cH", widget: string, required: false }
              - { name: ctEy, label: "ctEy", widget: string, required: false }
              - { name: ctH, label: "ctH", widget: string, required: false }
              - { name: ctP, label: "ctP", widget: text, required: false }
              - { name: ctB, label: "ctB", widget: string, required: false }
              - { name: foot, label: "foot", widget: string, required: false }
              - { name: all, label: "all", widget: string, required: false }
              - { name: hook, label: "hook", widget: text, required: false }
              - { name: about, label: "about", widget: text, required: false }
          - name: stats
            label: "الأرقام"
            widget: list
            summary: "{{fields.number}}{{fields.suffix}} — {{fields.label_ar}}"
            fields:
              - { name: number, label: "الرقم", widget: number }
              - { name: suffix, label: "بعد الرقم (+ أو st)", widget: string, required: false }
              - { name: label_ar, label: "الوصف بالعربي", widget: string }
              - { name: label_en, label: "English label", widget: string }
          - name: services
            label: "الخدمات"
            widget: list
            summary: "{{fields.title_ar}}"
            fields:
              - { name: title_ar, label: "اسم الخدمة بالعربي", widget: string }
              - { name: title_en, label: "Service name", widget: string }
              - { name: desc_ar, label: "الوصف بالعربي", widget: text, required: false }
              - { name: desc_en, label: "Description", widget: text, required: false }
          - name: categories
            label: "أسماء أقسام الأعمال"
            widget: object
            collapsed: true
            fields:
              - { name: film, label: "أفلام", widget: object, fields: [{ name: ar, label: "عربي", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: series, label: "مسلسلات", widget: object, fields: [{ name: ar, label: "عربي", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: music, label: "أغاني", widget: object, fields: [{ name: ar, label: "عربي", widget: string }, { name: en, label: "English", widget: string }] }
