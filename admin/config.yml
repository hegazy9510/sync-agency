  - name: site
    label: "⚙️ إعدادات الموقع"
    editor: { preview: false }
    files:
      - name: settings
        label: "الكلام والتواصل والعملاء"
        file: content/settings.json
        fields:
          - { name: email, label: "الإيميل", widget: string }
          - { name: portrait, label: "صورتك الشخصية", widget: image, required: false }
          - name: text_ar
            label: "الكلام بالعربي"
            widget: object
            fields:
              - { name: hero, label: "وصف الصفحة الرئيسية", widget: text }
              - { name: hook, label: "الجملة الكبيرة في (عنّي)", widget: text }
              - { name: about, label: "التعريف (افصل الفقرات بسطر فاضي)", widget: text }
          - name: text_en
            label: "English text"
            widget: object
            fields:
              - { name: hero, label: "Hero description", widget: text }
              - { name: hook, label: "About headline", widget: text }
              - { name: about, label: "About (blank line between paragraphs)", widget: text }
          - name: stats
            label: "الأرقام"
            widget: list
            summary: "{{fields.number}}{{fields.suffix}} — {{fields.label_ar}}"
            fields:
              - { name: number, label: "الرقم", widget: number }
              - { name: suffix, label: "بعد الرقم (+ أو st)", widget: string, required: false }
              - { name: label_ar, label: "الوصف بالعربي", widget: string }
              - { name: label_en, label: "English label", widget: string }
          - name: clients
            label: "العملاء"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "اسم الشركة", widget: string }
              - { name: logo, label: "لوجو الشركة", widget: image, required: false }
          - name: links
            label: "لينكات التواصل"
            widget: list
            summary: "{{fields.name}} — {{fields.label}}"
            fields:
              - { name: name, label: "المنصة", widget: string }
              - { name: label, label: "النص الظاهر", widget: string }
              - { name: url, label: "اللينك", widget: string }
