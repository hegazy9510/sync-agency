              - { name: social, label: "سوشيال", widget: object, fields: [{ name: ar, label: "عربي", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: ai, label: "ذكاء اصطناعي", widget: object, fields: [{ name: ar, label: "عربي", widget: string }, { name: en, label: "English", widget: string }] }
          - { name: tags, label: "الكلمات تحت التعريف", widget: list, required: false }
          - { name: marquee, label: "كلمات الشريط المتحرك", widget: list, required: false }
          - name: clients
            label: "العملاء"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "اسم الشركة", widget: string }
              - { name: logo, label: "لوجو الشركة", widget: image, required: false }
          - name: links
            label: "لينكات التواصل"
            widget: list
            summary: "{{fields.name}} — {{fields.label}}"
            fields:
              - { name: name, label: "المنصة", widget: string }
              - { name: label, label: "النص الظاهر", widget: string }
              - { name: url, label: "اللينك", widget: string }
